<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<script src="popup.js"></script>
<style>
body {
  min-width: 500px;
  max-width: 1200px;
  min-height: 300px;
  max-height: 800px;
  margin: 0;
  padding: 10px;
  overflow: auto;
  font-family: sans-serif;
  background-color: white;
}

.toolbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 4px 2px 10px 2px;
}

.toolbar-actions {
  display: flex;
  gap: 6px;
}

.toolbar-title {
  font-size: 12px;
  color: #555;
}

.toolbar-button {
  border: 1px solid #ccc;
  background: #fff;
  padding: 4px 8px;
  font-size: 12px;
  cursor: pointer;
}

.toolbar-button:hover {
  background: #f5f5f5;
}

.toolbar-button:disabled {
  color: #777;
  cursor: default;
  background: #f5f5f5;
}

/* Layout */
.container {
  width: 100%;
  height: calc(100% - 70px);
  overflow: auto;
  padding: 10px;
  box-sizing: border-box;
}

/* Tabs */
.tab-container {
  display: flex;
  border-bottom: 1px solid #ccc;
  background: #f5f5f5;
  position: sticky; /* Keep tabs visible */
  top: 0;
  z-index: 10;
}

.tab-button {
  padding: 8px 16px;
  border: none;
  background: none;
  cursor: pointer;
  font-size: 14px;
}

.tab-button:hover {
  background-color: #e0e0e0;
}

.tab-button.active {
  background: #fff;
  border-bottom: 2px solid #0078d4;
  color: #0078d4;
  font-weight: bold;
}

/* Project Views */
.project-container {
  display: none;
}

.project-container.active {
  display: block;
}

.project-summary {
    padding: 10px 0;
    font-weight: bold;
    border-bottom: 1px solid #eee;
}

.my-approvals-project + .my-approvals-project {
  margin-top: 12px;
}

.my-approvals-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 0;
}

.open-all-status {
  font-size: 12px;
  color: #555;
}

.open-all-status.error {
  color: red;
}

.status-message {
  padding: 10px 0;
  color: #333;
}

.error-message {
    color: red;
    padding: 10px;
}

/* Data Table */
table {
    border-collapse: collapse;
    width: 100%;
    font-size: 10pt;
}

th {
    text-align: left;
    background-color: #f9f9f9;
    padding: 4px;
    border-bottom: 1px solid #ddd;
}

td {
  padding: 4px;
  white-space: nowrap;
  vertical-align: middle;
  border-bottom: 1px solid #f0f0f0;
}

/* Utilities / Text Styles replace inline styles */
.text-blue { color: blue; }
.text-underline { text-decoration: underline; }
.avatar { vertical-align: middle; margin-right: 4px; border-radius: 50%; }
.approval-row-mine td { background-color: #fff7d6; } /* pale yellow */

</style>
</head>
<body>
  <div class="toolbar">
    <span class="toolbar-title" id="orgLabel"></span>
    <div class="toolbar-actions">
      <button class="toolbar-button" id="refreshButton" type="button">Refresh</button>
      <button class="toolbar-button" id="openOptionsButton" type="button">Settings</button>
    </div>
  </div>
  <div class="tab-container" id="tabContainer"></div>
  <div class="container" id="contentContainer"></div>
</body>
</html>
